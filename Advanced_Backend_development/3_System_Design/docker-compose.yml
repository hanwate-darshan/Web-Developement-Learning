services:
    nginx:
       image : nginx
       ports : 
           - 8000:80
       volumes:
           - ./nginx/nginx.conf:/etc/nginx/nginx.conf    
    server1:
        build: ./server/phase_1  
        env_file:
            - ./server/phase_1/.env
        environment:
            - SERVER_NAME="first server"    
        ports:
            - 5001:7000
    server2:
        build: ./server/phase_1  
        env_file:
            - ./server/phase_1/.env
        environment:
            - SERVER_NAME="second server" 
        ports:
            - 5002:7000
    server3:
        build: ./server/phase_1  
        env_file:
            - ./server/phase_1/.env
        environment:
            - SERVER_NAME="third server" 
        ports:
            - 5003:7000
            